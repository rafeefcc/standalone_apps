<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scraping Control Panel</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin: 0;
        background-color: #f7f9fc;
        color: #333; /* Default text color */
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      a {
        color: #007bff; /* Default link color */
        transition: color 0.3s ease;
      }
      body.dark-mode a {
        color: #66ccff; /* Link color in dark mode */
      }
      .main-nav {
        width: 100%;
        background-color: #007bff;
        padding: 10px 0;
        text-align: center;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .main-nav .nav-link {
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        margin: 0 10px;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }
      .main-nav .nav-link:hover {
        background-color: #0056b3;
      }
      /* Dark mode styles for navigation */
      body.dark-mode .main-nav {
        background-color: #333;
      }
      body.dark-mode .main-nav .nav-link {
        color: #f4f4f4;
      }
      body.dark-mode .main-nav .nav-link:hover {
        background-color: #555;
      }
      .container {
        text-align: center;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        background-color: white;
        width: 600px;
        transition:
          background-color 0.3s ease,
          box-shadow 0.3s ease;
      }
      h1 {
        font-weight: 700;
        color: #333;
      }
      .input-group {
        margin-bottom: 15px;
      }
      .input-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }
      input[type='text'],
      input[type='password'],
      select {
        padding: 12px;
        margin-bottom: 10px;
        width: 90%;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        box-sizing: border-box; /* Include padding in width */
      }
      button {
        padding: 12px 25px;
        border: none;
        color: white;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          transform 0.2s ease;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        font-size: 16px;
        margin: 5px;
        background-color: #007bff; /* Default button color */
      }
      button:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
      }
      #status {
        margin-top: 25px;
        padding: 12px;
        border-radius: 8px;
        background-color: #e9ecef;
        color: #495057;
        min-height: 20px;
        text-align: left;
        white-space: pre-wrap;
        max-height: 300px; /* Limit height of status box */
        overflow-y: auto; /* Enable scrolling for logs */
        width: 90%;
        margin-left: auto;
        margin-right: auto;
      }
      .hidden {
        display: none;
      }
      .dark-mode {
        background-color: #333;
        color: #f4f4f4;
      }
      .dark-mode .container {
        background-color: #444;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }
      .dark-mode h1 {
        color: #66ccff;
      }
      .dark-mode input[type='text'],
      .dark-mode input[type='password'],
      .dark-mode select {
        background-color: #555;
        color: #f4f4f4;
        border-color: #666;
      }
      .dark-mode button {
        background-color: #66ccff;
        color: #333;
      }
      .dark-mode button:hover {
        background-color: #3399ff;
      }
      .toggle-container {
        text-align: right;
        margin-bottom: 10px;
        width: 600px; /* Match container width */
        margin-top: 20px;
      }
      .toggle-button {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
      }
      .app-footer {
        width: 100%;
        background-color: #f2f2f2;
        color: #555;
        text-align: center;
        padding: 15px 0;
        margin-top: 40px; /* Add some space above the footer */
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
      }
      .app-footer p {
        margin: 0;
        font-size: 0.9em;
      }
      /* Dark mode styles for footer */
      body.dark-mode .app-footer {
        background-color: #222;
        color: #bbb;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <nav class="main-nav">
      <a href="/" class="nav-link">Control Panel</a>
      <a href="/results" class="nav-link">Scraped Results</a>
    </nav>
    <div class="toggle-container">
      <button id="darkModeToggle" class="toggle-button">☀️</button>
    </div>
    <div class="container">
      <h1>Scraping Control Panel</h1>

      <div class="input-group">
        <label for="scraperType">Select Scraper:</label>
        <select id="scraperType">
          <option value="gmaps">Google Maps</option>
          <option value="facebook">Facebook</option>
          <option value="wikipedia">Wikipedia Test</option>
        </select>
      </div>

      <!-- Dynamic Input Fields -->
      <div id="gmapsFields" class="input-group hidden">
        <input
          type="text"
          id="businessType"
          placeholder="Enter business type (e.g., restaurants)"
        />
        <input
          type="text"
          id="city"
          placeholder="Enter city (e.g., New York)"
        />
        <p style="font-size: 12px; color: #666; margin-top: -10px">
          Uses Google Maps API. For headless or manual, use separate buttons
          below.
        </p>
        <button id="apiScrapeBtn">Scrape (API)</button>
        <button id="headlessScrapeBtn">Scrape (Headless)</button>
      </div>

      <div id="facebookFields" class="input-group hidden">
        <input
          type="text"
          id="postUrl"
          placeholder="Enter Facebook Post or Search URL"
        />
        <input type="text" id="fbEmail" placeholder="Enter Facebook Email" />
        <input
          type="password"
          id="fbPassword"
          placeholder="Enter Facebook Password"
        />
        <p style="font-size: 12px; color: #666; margin-top: -10px">
          Email & Password are only needed for the first login. A session will
          be saved for future use.
        </p>
      </div>

      <div id="wikipediaFields" class="input-group hidden">
        <input
          type="text"
          id="testQuery"
          placeholder="Enter a search term (e.g., Odoo)"
        />
      </div>

      <button id="unifiedScrapeBtn" class="hidden">Scrape</button>
      <!-- Hide the unified button -->

      <div id="status">Ready to start.</div>
      <div style="margin-top: 20px">
        <a href="/results">View Scraped Results</a>
      </div>
    </div>

    <script>
      // --- Element Selectors ---
      const scraperTypeSelect = document.getElementById('scraperType');
      const gmapsFields = document.getElementById('gmapsFields');
      const facebookFields = document.getElementById('facebookFields');
      const wikipediaFields = document.getElementById('wikipediaFields');
      const unifiedScrapeBtn = document.getElementById('unifiedScrapeBtn'); // Keep for other scrapers
      const apiScrapeBtn = document.getElementById('apiScrapeBtn'); // New API button
      const headlessScrapeBtn = document.getElementById('headlessScrapeBtn'); // New Headless button
      const statusDiv = document.getElementById('status');

      // Input fields for each type
      const businessTypeInput = document.getElementById('businessType');
      const cityInput = document.getElementById('city');
      const postUrlInput = document.getElementById('postUrl');
      const fbEmailInput = document.getElementById('fbEmail');
      const fbPasswordInput = document.getElementById('fbPassword');
      const testQueryInput = document.getElementById('testQuery');
      // --- End Element Selectors ---

      // --- UI Logic ---
      function showFields(type) {
        gmapsFields.classList.add('hidden');
        facebookFields.classList.add('hidden');
        wikipediaFields.classList.add('hidden');
        unifiedScrapeBtn.classList.add('hidden'); // Hide unified button by default

        if (type === 'gmaps') {
          gmapsFields.classList.remove('hidden');
          // The API and Headless buttons are within gmapsFields, so they will show/hide with it
        } else if (type === 'facebook') {
          facebookFields.classList.remove('hidden');
          unifiedScrapeBtn.classList.remove('hidden'); // Show unified button for Facebook
        } else if (type === 'wikipedia') {
          wikipediaFields.classList.remove('hidden');
          unifiedScrapeBtn.classList.remove('hidden'); // Show unified button for Wikipedia
        }
      }

      // Initialize UI on load
      document.addEventListener('DOMContentLoaded', () => {
        showFields(scraperTypeSelect.value);
      });

      // Event listener for dropdown change
      scraperTypeSelect.addEventListener('change', (event) => {
        showFields(event.target.value);
      });
      // --- End UI Logic ---

      // --- Scrape Functions ---
      // Function for EventSource (SSE) based scrapers (Facebook, Wikipedia)
      function runEventSourceScrape(url, params) {
        statusDiv.textContent = ''; // Clear status box
        // Disable all relevant buttons during scrape
        unifiedScrapeBtn.disabled = true;
        if (apiScrapeBtn) apiScrapeBtn.disabled = true;
        if (headlessScrapeBtn) headlessScrapeBtn.disabled = true;

        const queryParams = new URLSearchParams(params);
        const eventSource = new EventSource(`${url}?${queryParams.toString()}`);

        statusDiv.textContent = 'Connecting to log stream...\n';

        eventSource.onmessage = function (event) {
          if (event.data.includes('---')) {
            // Simplified check for script finish
            eventSource.close();
            unifiedScrapeBtn.disabled = false;
            if (apiScrapeBtn) apiScrapeBtn.disabled = false;
            if (headlessScrapeBtn) headlessScrapeBtn.disabled = false;
            statusDiv.textContent += '\nStream closed by server.';
          } else if (event.data.includes('Connection closed')) {
            eventSource.close();
            unifiedScrapeBtn.disabled = false;
            if (apiScrapeBtn) apiScrapeBtn.disabled = false;
            if (headlessScrapeBtn) headlessScrapeBtn.disabled = false;
          } else {
            statusDiv.textContent += event.data + '\n';
          }
        };

        eventSource.onerror = function (err) {
          console.error('EventSource failed:', err);
          statusDiv.textContent +=
            '\nError connecting to log stream. Connection closed.';
          eventSource.close();
          unifiedScrapeBtn.disabled = false;
          if (apiScrapeBtn) apiScrapeBtn.disabled = false;
          if (headlessScrapeBtn) headlessScrapeBtn.disabled = false;
        };
      }

      // Function for Fetch (JSON) based scrapers (Google Maps API, Headless Google Maps)
      async function runJsonScrape(url, params) {
        statusDiv.textContent = ''; // Clear status box
        // Disable all relevant buttons during scrape
        unifiedScrapeBtn.disabled = true;
        if (apiScrapeBtn) apiScrapeBtn.disabled = true;
        if (headlessScrapeBtn) headlessScrapeBtn.disabled = false;

        statusDiv.textContent = 'Sending request...\n';

        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(params),
          });

          const result = await response.json();
          if (response.ok) {
            statusDiv.textContent += `Success: ${result.message || JSON.stringify(result)}\n`;
          } else {
            statusDiv.textContent += `Error: ${result.error || JSON.stringify(result)}\n`;
          }
        } catch (error) {
          console.error('Fetch failed:', error);
          statusDiv.textContent += `Network Error: ${error.message}\n`;
        } finally {
          unifiedScrapeBtn.disabled = false;
          if (apiScrapeBtn) apiScrapeBtn.disabled = false;
          if (headlessScrapeBtn) headlessScrapeBtn.disabled = false;
        }
      }

      // --- Event Listener for Scrape Buttons ---
      // Unified button for Facebook and Wikipedia
      unifiedScrapeBtn.addEventListener('click', () => {
        const selectedScraper = scraperTypeSelect.value;
        let params = {};
        let endpoint = '';

        if (selectedScraper === 'facebook') {
          const url = postUrlInput.value;
          const email = fbEmailInput.value;
          const password = fbPasswordInput.value;
          if (!url) {
            statusDiv.textContent = 'Please fill out the Facebook URL field.';
            return;
          }
          params = { url, email, password };
          endpoint = '/scrape/facebook';
        } else if (selectedScraper === 'wikipedia') {
          const query = testQueryInput.value;
          if (!query) {
            statusDiv.textContent = 'Please enter a search term for Wikipedia.';
            return;
          }
          params = { query };
          endpoint = '/scrape/test';
        }

        if (endpoint) {
          runEventSourceScrape(endpoint, params); // Use EventSource for these
        }
      });

      // New event listener for API Scrape Button
      apiScrapeBtn.addEventListener('click', () => {
        const businessType = businessTypeInput.value;
        const city = cityInput.value;
        if (!businessType || !city) {
          statusDiv.textContent = 'Please fill out both Google Maps fields.';
          return;
        }
        const params = { query: `${businessType} in ${city}` };
        runJsonScrape('/scrape/api', params); // Use Fetch for API
      });

      // New event listener for Headless Scrape Button
      headlessScrapeBtn.addEventListener('click', () => {
        const businessType = businessTypeInput.value;
        const city = cityInput.value;
        if (!businessType || !city) {
          statusDiv.textContent = 'Please fill out both Google Maps fields.';
          return;
        }
        const params = { query: `${businessType} in ${city}` };
        runJsonScrape('/scrape/headless', params); // Use Fetch for Headless
      });
    </script>
    <script>
      const darkModeToggle = document.getElementById('darkModeToggle');
      const body = document.body;

      // Check for saved dark mode preference
      if (localStorage.getItem('darkMode') === 'enabled') {
        body.classList.add('dark-mode');
        darkModeToggle.textContent = '🌙';
      } else {
        darkModeToggle.textContent = '☀️';
      }

      darkModeToggle.addEventListener('click', () => {
        body.classList.toggle('dark-mode');
        if (body.classList.contains('dark-mode')) {
          localStorage.setItem('darkMode', 'enabled');
          darkModeToggle.textContent = '🌙';
        } else {
          localStorage.setItem('darkMode', 'disabled');
          darkModeToggle.textContent = '☀️';
        }
      });
    </script>
    <footer class="app-footer">
      <p>Powered by Taxample.com(c) team 2024</p>
    </footer>
  </body>
</html>
